# render.yaml - single-service Render deployment blueprint

services:
  - type: web
    name: smartroute-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: smartroute-documents
      - key: HF_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ENABLE_SPARSE_EMBEDDINGS
        value: "false"
      - key: ENVIRONMENT
        value: production
      - key: APP_PUBLIC_URL
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DOCUMENTS_DIR
        value: data/documents
      - key: ALLOWED_ORIGINS
        value: ""
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "https://cloud.langfuse.com/api/public/otel/v1/traces"
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: OTEL_SERVICE_NAME
        value: smartroute-ai
