# render.yaml — One-click Render deployment blueprint

services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  - type: web
    name: smartroute-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    preDeployCommand: "alembic upgrade head"
    healthCheckPath: /health
    envVars:
      # ── Required Provider Keys ────────────────────────────────────────────────
      - key: OPENROUTER_API_KEY
        sync: false

      - key: SUPABASE_JWT_SECRET
        sync: false

      - key: HF_TOKEN
        sync: false

      # ── Database — Supabase ───────────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false

      # ── Vector DB — Qdrant Cloud ──────────────────────────────────────────────
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false

      # ── Redis — Upstash ───────────────────────────────────────────────────────
      - key: REDIS_URL
        sync: false

      # ── Runtime config ────────────────────────────────────────────────────────
      - key: ENVIRONMENT
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"

      # ── CORS ──────────────────────────────────────────────────────────────────
      - key: ALLOWED_ORIGINS
        value: "https://smartroute-ai.streamlit.app,http://localhost:8501"

      # ── Tracing — LangFuse ────────────────────────────────────────────────────
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "https://cloud.langfuse.com/api/public/otel"
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: OTEL_SERVICE_NAME
        value: smartroute-api

  # ── Streamlit Dashboard ──────────────────────────────────────────────────────
  - type: web
    name: smartroute-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore

    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PORT
        value: "8501"
