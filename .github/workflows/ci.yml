name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.10"
  NODE_VERSION: "22"
  HF_TOKEN: "dummy_hf_token_for_ci_tests"
  DATABASE_URL: "sqlite:///:memory:"
  REDIS_URL: "redis://localhost:6379/0"
  QDRANT_URL: "https://test.qdrant.io"
  QDRANT_API_KEY: "test-key"
  OPENROUTER_API_KEY: "test-openrouter-key"
  SUPABASE_JWT_SECRET: "super-secret-jwt-token-with-at-least-32-characters-long"
  SUPABASE_URL: "https://test.supabase.co"
  SUPABASE_SERVICE_ROLE_KEY: "test-service-role-key"
  SUPABASE_STORAGE_BUCKET: "smartroute-documents"
  ENABLE_SPARSE_EMBEDDINGS: "false"

jobs:
  backend-lint-format:
    name: Backend lint and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install backend dependencies
        run: uv sync --all-groups

      - name: Ruff lint
        run: uv run ruff check src/ api/ tests/ --output-format=github

      - name: Ruff format check
        run: uv run ruff format --check src/ api/ tests/

  backend-type-analysis:
    name: Backend static type analysis
    runs-on: ubuntu-latest
    needs: backend-lint-format
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install backend dependencies
        run: uv sync --all-groups

      - name: Mypy
        run: |
          uv run mypy src/ api/ \
            --ignore-missing-imports \
            --no-strict-optional \
            --warn-return-any \
            --show-error-codes

  backend-unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    needs: backend-type-analysis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install backend dependencies
        run: uv sync --all-groups

      - name: Pytest unit suite
        run: uv run pytest tests/ -v

  backend-integration-tests:
    name: Backend integration tests
    runs-on: ubuntu-latest
    needs: backend-unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install backend dependencies
        run: uv sync --all-groups

      - name: API integration tests
        run: uv run pytest tests/test_api.py -v

  frontend:
    name: Frontend install, typecheck, tests, and build
    runs-on: ubuntu-latest
    needs: backend-integration-tests
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies from lockfile
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npm test --if-present

      - name: Frontend production build
        run: npm run build

      - name: Frontend vulnerability scan
        run: npm audit --audit-level=high

  docker-production-smoke:
    name: Production Docker build and smoke test
    runs-on: ubuntu-latest
    needs: frontend
    env:
      IMAGE_TAG: smartroute-ai:${{ github.sha }}
      CONTAINER_NAME: smartroute-ai-ci
      PORT: "8000"
    steps:
      - uses: actions/checkout@v4

      - name: Build production Docker image with build identity
        run: |
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          docker build \
            --build-arg COMMIT_SHA="${GITHUB_SHA}" \
            --build-arg BUILD_TIME="${BUILD_TIME}" \
            -t "${IMAGE_TAG}" \
            .

      - name: Start built container
        run: |
          docker run -d \
            --name "${CONTAINER_NAME}" \
            -p 8000:8000 \
            -e PORT=8000 \
            -e DATABASE_URL="${DATABASE_URL}" \
            -e REDIS_URL="${REDIS_URL}" \
            -e QDRANT_URL="${QDRANT_URL}" \
            -e QDRANT_API_KEY="${QDRANT_API_KEY}" \
            -e OPENROUTER_API_KEY="${OPENROUTER_API_KEY}" \
            -e HF_TOKEN="${HF_TOKEN}" \
            -e SUPABASE_JWT_SECRET="${SUPABASE_JWT_SECRET}" \
            -e SUPABASE_URL="${SUPABASE_URL}" \
            -e SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY}" \
            -e SUPABASE_STORAGE_BUCKET="${SUPABASE_STORAGE_BUCKET}" \
            -e ENABLE_SPARSE_EMBEDDINGS="${ENABLE_SPARSE_EMBEDDINGS}" \
            "${IMAGE_TAG}"

      - name: Check health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${PORT}/health"; then
              exit 0
            fi
            echo "Waiting for /health (${attempt}/30)..."
            sleep 5
          done
          docker logs "${CONTAINER_NAME}"
          exit 1

      - name: Confirm API exposes the checked commit
        run: |
          curl -fsS "http://127.0.0.1:${PORT}/version" -o version.json
          python - <<'PY'
          import json
          import os
          import sys

          with open("version.json", encoding="utf-8") as handle:
              payload = json.load(handle)

          expected = os.environ["GITHUB_SHA"]
          actual = payload.get("commit_sha")
          if actual != expected:
              print(f"/version commit mismatch: expected {expected}, got {actual}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Confirm frontend and API are served
        run: |
          curl -fsS -H "Accept: text/html" "http://127.0.0.1:${PORT}/" -o frontend.html
          grep -qi "SmartRoute" frontend.html
          curl -fsS "http://127.0.0.1:${PORT}/health" -o health.json

      - name: Run browser smoke tests when configured
        working-directory: frontend
        run: |
          if [ -f playwright.config.ts ] || [ -f playwright.config.js ]; then
            npm run test:e2e --if-present
          elif [ -f cypress.config.ts ] || [ -f cypress.config.js ]; then
            npm run cypress:run --if-present
          else
            echo "No browser smoke test configuration found; skipping."
          fi

      - name: Clean up smoke-test container
        if: always()
        run: |
          docker logs "${CONTAINER_NAME}" || true
          docker rm -f "${CONTAINER_NAME}" || true
