name: Deploy Render

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Optional full 40-character commit SHA to deploy"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: render-production
  cancel-in-progress: false

jobs:
  resolve-commit:
    name: Resolve exact commit
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    outputs:
      commit_sha: ${{ steps.validate.outputs.commit_sha }}
    steps:
      - name: Select requested SHA
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ inputs.commit_sha }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            requested_sha="${WORKFLOW_RUN_SHA}"
          elif [ -n "${MANUAL_SHA}" ]; then
            requested_sha="${MANUAL_SHA}"
          else
            requested_sha="${DEFAULT_SHA}"
          fi

          if ! printf '%s' "${requested_sha}" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "Commit SHA must be a full 40-character Git SHA." >&2
            exit 1
          fi

          requested_sha="$(printf '%s' "${requested_sha}" | tr 'A-F' 'a-f')"
          echo "requested_sha=${requested_sha}" >> "${GITHUB_OUTPUT}"

      - name: Check out exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.select.outputs.requested_sha }}
          fetch-depth: 0

      - name: Validate checked-out SHA
        id: validate
        run: |
          resolved_sha="$(git rev-parse HEAD)"
          if ! printf '%s' "${resolved_sha}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Resolved value is not a full lowercase 40-character Git SHA: ${resolved_sha}" >&2
            exit 1
          fi

          if [ "${resolved_sha}" != "${{ steps.select.outputs.requested_sha }}" ]; then
            echo "Checked-out SHA does not match requested SHA." >&2
            echo "requested=${{ steps.select.outputs.requested_sha }}" >&2
            echo "resolved=${resolved_sha}" >&2
            exit 1
          fi

          echo "commit_sha=${resolved_sha}" >> "${GITHUB_OUTPUT}"

      - name: Verify manual SHA already passed CI
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ steps.validate.outputs.commit_sha }}';
            const { owner, repo } = context.repo;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: 'ci.yml',
              branch: 'main',
              head_sha: sha,
              status: 'completed',
              per_page: 100,
            });

            const successfulRun = runs.find((run) =>
              run.head_sha === sha &&
              run.head_branch === 'main' &&
              run.conclusion === 'success'
            );

            if (!successfulRun) {
              core.setFailed(`No successful completed CI run on main was found for ${sha}.`);
              return;
            }

            core.info(`Verified CI run ${successfulRun.id} succeeded for ${sha}.`);

  deploy:
    name: Deploy exact commit to Render
    runs-on: ubuntu-latest
    needs: resolve-commit
    environment: production
    env:
      COMMIT_SHA: ${{ needs.resolve-commit.outputs.commit_sha }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
    steps:
      - name: Prepare deployment verification report
        run: |
          {
            echo "# Render deployment verification"
            echo
            echo "- Commit SHA: ${COMMIT_SHA}"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Started at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > deployment-verification-report.md

      - name: Validate deployment configuration
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is required." >&2
            exit 1
          fi

          if [ -z "${PRODUCTION_BASE_URL}" ]; then
            echo "PRODUCTION_BASE_URL repository/environment variable is required for /version verification." >&2
            exit 1
          fi

      - name: Trigger Render deploy hook for exact SHA
        run: |
          deploy_url="$(python -c 'import os, urllib.parse; url=os.environ["RENDER_DEPLOY_HOOK_URL"]; sha=os.environ["COMMIT_SHA"]; parts=urllib.parse.urlsplit(url); query=urllib.parse.parse_qsl(parts.query, keep_blank_values=True); query.append(("ref", sha)); print(urllib.parse.urlunsplit((parts.scheme, parts.netloc, parts.path, urllib.parse.urlencode(query), parts.fragment)))')"
          http_code="$(curl -sS -X POST -o render-deploy-hook-response.json -w '%{http_code}' "${deploy_url}")"
          {
            echo
            echo "## Render deploy hook"
            echo
            echo "- HTTP status: ${http_code}"
          } >> deployment-verification-report.md

          if ! printf '%s' "${http_code}" | grep -Eq '^2[0-9][0-9]$'; then
            echo "Render deploy hook returned HTTP ${http_code}." >&2
            cat render-deploy-hook-response.json >&2
            exit 1
          fi

      - name: Wait for production /version to report exact SHA
        run: |
          base_url="${PRODUCTION_BASE_URL%/}"
          success="false"

          for attempt in $(seq 1 60); do
            http_code="$(curl -sS -o version-response.json -w '%{http_code}' "${base_url}/version" || true)"
            reported_sha="$(python -c 'import json, sys; print(json.load(open("version-response.json", encoding="utf-8")).get("commit_sha", ""))' 2>/dev/null || true)"

            echo "Attempt ${attempt}: HTTP ${http_code}, commit '${reported_sha}'"

            if [ "${http_code}" = "200" ] && [ "${reported_sha}" = "${COMMIT_SHA}" ]; then
              success="true"
              break
            fi

            sleep 10
          done

          {
            echo
            echo "## Production verification"
            echo
            echo "- Version URL: ${base_url}/version"
            echo "- Expected commit: ${COMMIT_SHA}"
            echo "- Final /version response:"
            echo
            echo '```json'
            cat version-response.json || true
            echo
            echo '```'
            echo "- Finished at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> deployment-verification-report.md

          if [ "${success}" != "true" ]; then
            echo "Production did not report the expected commit SHA ${COMMIT_SHA}." >&2
            exit 1
          fi

      - name: Upload deployment verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-verification-${{ needs.resolve-commit.outputs.commit_sha }}
          path: |
            deployment-verification-report.md
            render-deploy-hook-response.json
            version-response.json
          if-no-files-found: warn
